version: '3.8'

services:
  ldes-postgres:
    image: postgres:latest
    container_name: adlib-ldes-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-adlib_ldes}
    ports:
      - "5432:5432"
    volumes:
      - ldes-postgres-data:/var/lib/postgresql/data
    networks:
      - ldes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-adlib_ldes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ldes-server:
    image: ldes/ldes-server:3.6.1
    container_name: adlib-ldes-server
    environment:
      SERVER_PORT: 80
      SIS_DATA: >
        spring.datasource.url=jdbc:postgresql://ldes-postgres:5432/${POSTGRES_DB:-adlib_ldes}
        spring.datasource.username=${POSTGRES_USER:-admin}
        spring.datasource.password=${POSTGRES_PASSWORD:-admin}
      LDESSERVER_HOSTNAME: ${LDES_HOSTNAME:-http://localhost:9003}
    ports:
      - "9003:80"
    networks:
      - ldes-network
    depends_on:
      ldes-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  ldes-network:
    driver: bridge

volumes:
  ldes-postgres-data:
    driver: local
